name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        torch-version: ["locked"]
        include:
          - python-version: "3.11"
            torch-version: "2.13.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CPU PyTorch
        if: matrix.torch-version == 'locked'
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1"
      - name: Install minimum CPU PyTorch
        if: matrix.torch-version != 'locked'
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==${{ matrix.torch-version }}"
      - name: Install
        if: matrix.torch-version == 'locked'
        run: python -m pip install -c requirements-ci.txt -e ".[dev]"
      - name: Install minimum supported PyTorch
        if: matrix.torch-version != 'locked'
        run: python -m pip install -e ".[dev]" "torch==${{ matrix.torch-version }}"
      - name: Skill sync
        run: python scripts/sync_agent_skills.py --check
      - name: Ruff
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/adalift
      - name: Tests
        run: pytest --cov=adalift --cov-report=term-missing
      - name: CPU smoke with config
        run: adalift-smoke --config configs/mini_lift.yaml --steps 3 --batch-size 2
      - name: Installed distributions
        if: matrix.torch-version == 'locked'
        run: python scripts/verify_distribution.py
