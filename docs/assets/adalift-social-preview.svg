<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">AdaLiFT — Loop Flow Transformers with Adaptive Depth</title><desc id="desc">Independent PyTorch research implementation. A noisy latent passes through a prelude, shared recurrent core, and endpoint velocity readout. Core parameters are reused across depth; flow time and depth are separate.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#54dfc5"/></marker></defs><rect width="1280" height="640" fill="#081724"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="66" font-size="20" fill="#54dfc5" font-weight="bold">PYTORCH  /  FLOW MATCHING  /  RESEARCH ALPHA</text><text x="60" y="172" font-size="92" fill="#ecf5f8" font-weight="bold">AdaLiFT</text><text x="64" y="242" font-size="42" fill="#ecf5f8" font-weight="bold">Loop Flow Transformers</text><text x="64" y="297" font-size="38" fill="#a5c5d2" font-weight="normal">with adaptive recurrent depth</text><text x="64" y="350" font-size="23" fill="#a5c5d2" font-weight="normal">Reuse the core. Allocate depth. Preserve the endpoint.</text><rect x="64" y="405" width="200" height="104" rx="16" fill="#102b3b" stroke="#315669" stroke-width="2"/><text x="84" y="447" font-size="25" fill="#ecf5f8" font-weight="bold">Noisy latent</text><text x="84" y="482" font-size="21" fill="#a5c5d2" font-weight="normal">Flow time t</text><rect x="330" y="405" width="220" height="104" rx="16" fill="#102b3b" stroke="#315669" stroke-width="2"/><text x="350" y="447" font-size="25" fill="#ecf5f8" font-weight="bold">Prelude</text><text x="350" y="482" font-size="21" fill="#a5c5d2" font-weight="normal">Encode once</text><rect x="620" y="405" width="280" height="104" rx="16" fill="#102b3b" stroke="#315669" stroke-width="2"/><text x="640" y="447" font-size="25" fill="#ecf5f8" font-weight="bold">Shared core</text><text x="640" y="482" font-size="21" fill="#a5c5d2" font-weight="normal">Repeat across depth s</text><rect x="970" y="405" width="246" height="104" rx="16" fill="#102b3b" stroke="#315669" stroke-width="2"/><text x="990" y="447" font-size="25" fill="#ecf5f8" font-weight="bold">Velocity readout</text><text x="990" y="482" font-size="21" fill="#a5c5d2" font-weight="normal">Endpoint s = 1</text><path d="M272,457 H320" fill="none" stroke="#54dfc5" stroke-width="3"  marker-end="url(#arrow)"/><path d="M558,457 H610" fill="none" stroke="#54dfc5" stroke-width="3"  marker-end="url(#arrow)"/><path d="M908,457 H960" fill="none" stroke="#54dfc5" stroke-width="3"  marker-end="url(#arrow)"/><path d="M440,514 V550 H750 V515" fill="none" stroke="#54dfc5" stroke-width="3"  stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="465" y="582" font-size="19" fill="#a5c5d2" font-weight="normal">Prelude-state reinjection</text><text x="64" y="616" font-size="19" fill="#a5c5d2" font-weight="normal">github.com/ahmedjawedaj/adalift</text><text x="900" y="616" font-size="18" fill="#a5c5d2" font-weight="normal">Independent implementation</text></g></svg>