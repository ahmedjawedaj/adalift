<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" role="img" aria-labelledby="title desc"><title id="title">Adaptive inference: endpoint completion and active-row compaction</title><desc id="desc">Only active samples undergo the next core pass. A residual check can select early-exiting rows, which receive a final core pass at depth one and are returned. Remaining rows are compacted and continue. Reaching the loop budget already provides the endpoint.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#54dfc5"/></marker></defs><rect width="1280" height="580" fill="#081724"/><g font-family="Arial, Helvetica, sans-serif"><text x="64" y="65" font-size="22" fill="#54dfc5" font-weight="bold">ADAPTIVE INFERENCE</text><text x="64" y="112" font-size="35" fill="#ecf5f8" font-weight="bold">Each exiting sample completes the endpoint.</text><rect x="64" y="225" width="245" height="112" rx="16" fill="#102b3b" stroke="#315669" stroke-width="2"/><text x="84" y="268" font-size="26" fill="#ecf5f8" font-weight="bold">Active samples</text><text x="84" y="305" font-size="22" fill="#a5c5d2" font-weight="normal">Next core pass</text><rect x="380" y="225" width="245" height="112" rx="16" fill="#102b3b" stroke="#315669" stroke-width="2"/><text x="400" y="268" font-size="26" fill="#ecf5f8" font-weight="bold">Residual check</text><text x="400" y="305" font-size="22" fill="#a5c5d2" font-weight="normal">At interior depth</text><path d="M319,281 H367" fill="none" stroke="#54dfc5" stroke-width="3"  marker-end="url(#arrow)"/><rect x="810" y="180" width="406" height="112" rx="16" fill="#102b3b" stroke="#315669" stroke-width="2"/><text x="832" y="223" font-size="26" fill="#ecf5f8" font-weight="bold">Exiting rows: core at s = 1</text><text x="832" y="261" font-size="22" fill="#a5c5d2" font-weight="normal">Read out velocity, then finish</text><path d="M635,267 H715 V236 H797" fill="none" stroke="#54dfc5" stroke-width="3"  marker-end="url(#arrow)"/><text x="664" y="211" font-size="18" fill="#ffca6a" font-weight="bold">HALT</text><rect x="810" y="350" width="406" height="112" rx="16" fill="#102b3b" stroke="#315669" stroke-width="2"/><text x="832" y="393" font-size="26" fill="#ecf5f8" font-weight="bold">Remaining rows: compact</text><text x="832" y="431" font-size="22" fill="#a5c5d2" font-weight="normal">Continue with a smaller batch</text><path d="M635,296 H715 V406 H797" fill="none" stroke="#54dfc5" stroke-width="3"  marker-end="url(#arrow)"/><text x="653" y="444" font-size="18" fill="#54dfc5" font-weight="bold">CONTINUE</text><path d="M1013,469 V505 H38 V182 H186 V213" fill="none" stroke="#54dfc5" stroke-width="3"  stroke-dasharray="7 7" marker-end="url(#arrow)"/><text x="64" y="544" font-size="22" fill="#a5c5d2" font-weight="normal">Budget reached? The current s = 1 pass is final. All core counts include endpoint work.</text></g></svg>