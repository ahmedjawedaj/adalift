# Paper Appendix D, Tables 14-16: B/2 R2, K_train=4 (architecture and optimizer fields).
# Not encoded here: global batch 256, update count (500k main protocol or 100k for the
# Appendix B ablations), ImageNet latents, BF16 compute. No metric reproduction is claimed.
model:
  in_channels: 4
  input_size: 32
  patch_size: 2
  hidden_size: 768
  prelude_depth: 4
  recurrent_depth: 2
  num_heads: 12
  mlp_ratio: 4.0
  num_classes: 1000
  qk_norm: true

training:
  k_train: 4
  prelude_loss_weight: 0.01
  learning_rate: 0.0001
  ema_decay: 0.999
  seed: 42
  warmup_steps: 500
  adam_betas: [0.9, 0.999]
  adam_eps: 0.00000001
  weight_decay: 0.0
  grad_clip_norm: 1.0

sampling:
  num_steps: 50
  num_loops: 4
