[build-system]
requires = ["setuptools>=77.0.3,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "adalift"
dynamic = ["version"]
description = "PyTorch research implementation of LiFT (Loop Flow Transformers) with adaptive recurrent depth and endpoint-preserving inference."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "AdaLiFT Contributors" }]
keywords = [
  "pytorch", "loop-flow-transformers", "flow-matching", "diffusion-transformers",
  "recurrent-transformers", "adaptive-computation", "adaptive-inference",
  "test-time-compute", "generative-models", "reproducible-research",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.13",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
vision = ["torchvision>=0.19", "pillow>=10.0"]
metrics = ["torchmetrics[image]>=1.4", "scipy>=1.12"]
wandb = ["wandb>=0.18"]
dev = [
  "pytest==9.1.1",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
  "mypy==1.13.0",
  "pre-commit==4.0.1",
  "types-PyYAML==6.0.12.20260906",
  "build==1.2.2.post1",
  "twine==6.1.0",
]

[project.urls]
Homepage = "https://github.com/ahmedjawedaj/adalift"
Repository = "https://github.com/ahmedjawedaj/adalift"
Issues = "https://github.com/ahmedjawedaj/adalift/issues"

[project.scripts]
adalift-smoke = "adalift.training.smoke:main"

[tool.setuptools.dynamic]
version = {attr = "adalift.__version__"}

[tool.setuptools.package-data]
adalift = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["adalift"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "slow: tests that are too slow for the default local suite",
  "gpu: tests that require CUDA",
]

[tool.coverage.run]
source = ["adalift"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
