[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adalift"
version = "0.1.0"
description = "Clean-room research implementation of Loop Flow Transformers with adaptive recurrent-depth extensions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "AdaLiFT Contributors" }]
keywords = ["flow-matching", "diffusion-transformer", "recurrent-depth", "generative-models", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.4",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "safetensors>=0.4",
  "tqdm>=4.66",
]

[project.optional-dependencies]
vision = ["torchvision>=0.19", "pillow>=10.0"]
metrics = ["torchmetrics[image]>=1.4", "scipy>=1.12"]
wandb = ["wandb>=0.18"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4.0",
]

[project.urls]
Homepage = "https://github.com/OWNER/adalift"
Repository = "https://github.com/OWNER/adalift"
Issues = "https://github.com/OWNER/adalift/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["adalift"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "slow: tests that are too slow for the default local suite",
  "gpu: tests that require CUDA",
]

[tool.coverage.run]
source = ["adalift"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
